# Placeholder for the egress proxy (ADR-08). There is no cluster in this file, so there is nowhere a request
# could be forwarded: every request and every CONNECT gets a 403. Slice 7 replaces this with the allowlist
# and the ext_authz call to the decision point.
static_resources:
  listeners:
    - name: egress
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress
                route_config:
                  name: deny_all
                  virtual_hosts:
                    - name: deny_all
                      domains: ["*"]
                      routes:
                        - match:
                            connect_matcher: {}
                          direct_response:
                            status: 403
                            body:
                              inline_string: "ascc egress: denied, nothing is allowed out yet\n"
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: "ascc egress: denied, nothing is allowed out yet\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
