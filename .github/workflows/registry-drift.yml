name: Registry drift

# Daily: is the Cronsole catalog the homepage serves
# (ai-security-command-center.ai-automation-tools.dev/registry/) the one in registry/ on main, with the
# CORS header the Cronsole gallery needs? A publish that failed or never ran leaves registry/ correct
# and the public copy stale, and nothing inside the repo can see that. A failure here means run the
# Publish registry workflow (and check its deploy key). Copied from edge-spectrum's, with the check
# in Go: `go run ./src/cmd/buildregistry -published`.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_run:
    workflows: [Publish registry]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Not `verify`: that is the CI job's name, and a skipped job here must never stand in for it.
  live:
    if: github.repository == 'ai-automation-tools/ai-security-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pages takes a minute or two to rebuild after a publish.
      - name: Wait for Pages after a publish
        if: github.event_name == 'workflow_run'
        run: sleep 180
      - name: Hosted catalog matches registry/
        run: go run ./src/cmd/buildregistry -published
